services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-school}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_dev_only}
      POSTGRES_DB: ${POSTGRES_DB:-school_admission}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-school} -d ${POSTGRES_DB:-school_admission}"]
      interval: 3s
      timeout: 3s
      retries: 20
  backend:
    build: ./backend
    restart: on-failure
    environment:
      DB_CONNECTION: Host=db;Port=5432;Database=${POSTGRES_DB:-school_admission};Username=${POSTGRES_USER:-school};Password=${POSTGRES_PASSWORD:-change_me_dev_only}
      HOLD_DURATION_SECONDS: ${HOLD_DURATION_SECONDS:-600}
      Logging__LogLevel__Microsoft.EntityFrameworkCore.Database.Command: Warning
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
  frontend:
    build: ./frontend
    environment:
      BACKEND_URL: http://backend:8080
    depends_on:
      - backend
    ports:
      - "3000:80"
  tests:
    profiles: ["test"]
    build:
      context: ./backend
      dockerfile: Dockerfile.tests
    environment:
      TEST_DB_CONNECTION: Host=db;Port=5432;Database=school_test;Username=${POSTGRES_USER:-school};Password=${POSTGRES_PASSWORD:-change_me_dev_only}
    depends_on:
      db:
        condition: service_healthy
volumes:
  pgdata: